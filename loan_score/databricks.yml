# This is a Databricks asset bundle definition for loan_score.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: loan_score
  uuid: a305041e-6190-406d-8048-6f1a683e20a0

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: (dev ${workspace.current_user.short_name})
      source_linked_deployment: false
    workspace:
      host: https://dbc-eb0cf48b-1114.cloud.databricks.com/
  prod:
    mode: production
    workspace:
      host: https://dbc-eb0cf48b-1114.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/lndpoojan@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lndpoojan@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: lndpoojan@gmail.com
        level: CAN_MANAGE
